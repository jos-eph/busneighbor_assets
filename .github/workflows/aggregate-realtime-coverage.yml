name: Aggregate real-time coverage

# Folds one UTC day of sampler artifacts into a rolling 28-day window and
# publishes septacoverage.json — the evidence behind
# septameta.json's realtime.overrides.no_vehicle_positions.
#
# Behavior summary:
#   * Runs at 01:40 UTC and aggregates the PREVIOUS UTC day, whose last sample
#     slot was 23:17 UTC. That is 2h20m of slack against cron delay, and it
#     sits comfortably inside the sampler's 2-day artifact retention.
#   * Manual run via workflow_dispatch; pass an explicit date to re-aggregate a
#     past day, or push_release=false for a collect-and-build smoke test.
#   * Publishing is gated by repo variable RELEASE_COVERAGE_ENABLED, which must
#     equal the literal string 'true'. Separate from RELEASE_SEPTA_META_ENABLED
#     so coverage can be stopped without stopping the weekly route list.
#   * There is deliberately NO byte-comparison gate here. septacoverage.json is
#     expected to change daily; that is the point of it. The gate on
#     septameta.json stays exactly as it is, which is why the two documents sit
#     on two clocks in two files.
#   * SHADOW MODE: the proposed deny-list is uploaded and diffed against the
#     committed realtime_overrides.json, and nothing is committed. Arming the
#     sync is a separate, separately gated change.
#   * A tripped guard is a ::warning::, not a failed run. The aggregator still
#     exits 2 and the step records guards=tripped, which is what a future
#     override-sync step must gate on — but nothing here acts on the proposal,
#     so a red run every morning would be noise rather than signal. The window
#     needs 7 days before the depth guard stops tripping at all.
#   * Stdlib-only. The aggregator sees JSON, never protobuf, so this workflow
#     installs nothing despite holding contents: write.

on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC date to aggregate, YYYY-MM-DD (default: yesterday)'
        type: string
      push_release:
        description: 'Publish the coverage documents (false = build-only smoke test)'
        type: boolean
        default: true

permissions:
  contents: write   # required to create releases and upload assets

concurrency:
  group: coverage-aggregation
  cancel-in-progress: false   # never let a manual rerun clobber a scheduled run mid-flight

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        # Stdlib-only and offline, so this fails the job before anything is
        # collected or published. The sampler's tests skip themselves here.
        run: python -m unittest discover -s tests -v

      - name: Choose the UTC day
        id: day
        env:
          REQUESTED: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DAY="${REQUESTED:-$(date -u -d yesterday +%F)}"
          if ! printf '%s' "${DAY}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::date must be YYYY-MM-DD, got '${DAY}'"
            exit 1
          fi
          echo "day=${DAY}" >> "$GITHUB_OUTPUT"
          echo "DAY=${DAY}" >> "$GITHUB_ENV"
          echo "Aggregating UTC day ${DAY}"

      - name: Collect the day's sample artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p samples

          # actions/download-artifact cannot glob across runs: it reads the
          # current run, or exactly one other run via run-id, and `pattern:`
          # only filters within that. The REST list endpoint's `name` parameter
          # is an exact match, not a glob. So list everything and filter here.
          #
          # `select(.expired == false)` matters: expired artifacts stay in the
          # listing with a download URL that no longer resolves.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false)
                  | select(.name | startswith(\"rtcov-sample-${DAY}-\"))
                  | [.id, .name] | @tsv" > ids.tsv

          # Artifacts download as zips even when they hold a single file.
          # `gh api` follows the redirect to blob storage and streams the body,
          # so no token juggling is needed here.
          while IFS=$'\t' read -r id name; do
            [ -n "${id}" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > z.zip
            unzip -p z.zip sample.json > "samples/${name}.json"
          done < ids.tsv
          rm -f z.zip

          COUNT="$(find samples -name '*.json' | wc -l)"
          echo "Collected ${COUNT} sample(s) for ${DAY}"

          # Fail here rather than letting the aggregator call it a thin day, so
          # the cause reads "collection failed" and not "SEPTA was quiet".
          if [ "${COUNT}" -lt 4 ]; then
            echo "::error::Only ${COUNT} sample(s) collected for ${DAY}; expected 8. Artifacts may have expired, or the sampler is down."
            exit 1
          fi

      - name: Fetch the previous state and the published route list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prev
          if ! gh release download coverage-state \
                 --repo "${GITHUB_REPOSITORY}" \
                 --pattern septacoverage_state.json --dir prev 2>/dev/null; then
            echo "::notice::No previous state; starting a new window."
          fi
          gh release download current \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern septameta.json --dir prev

      - name: Aggregate
        id: aggregate
        run: |
          set -euo pipefail
          set +e
          python aggregate_realtime_coverage.py \
            --samples-dir samples \
            --septameta prev/septameta.json \
            --state prev/septacoverage_state.json \
            --output-dir out \
            --date "${DAY}"
          CODE=$?
          set -e

          # Exit 2 means a guard tripped: do not act on the proposal, but the
          # evidence is still true and still worth publishing. Only a hard
          # failure (1) stops the run.
          case "${CODE}" in
            0) echo "guards=passed" >> "$GITHUB_OUTPUT" ;;
            2) echo "guards=tripped" >> "$GITHUB_OUTPUT"
               echo "::warning::A guard tripped for ${DAY}: the coverage document is still published, but the proposed deny-list must not be applied. Expected while the window is filling — days_observed has to reach 7." ;;
            *) echo "::error::Aggregator failed with exit ${CODE}"; exit "${CODE}" ;;
          esac

          # A thin day writes only the daily summary and exits 0. Nothing to
          # publish, so say so and let later steps skip.
          if [ -f out/septacoverage.json ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No coverage document was produced for ${DAY} (thin day); nothing to publish."
          fi

      - name: Compare the proposal against the committed deny-list
        # Shadow mode: this is the whole point of the chunk. Print what WOULD
        # change, commit nothing, and let a couple of weeks of these notices say
        # whether the measurement agrees with the hand-written list.
        if: steps.aggregate.outputs.built == 'true'
        env:
          GUARDS: ${{ steps.aggregate.outputs.guards }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib

          proposed = json.loads(
              pathlib.Path("out/realtime_overrides.proposed.json").read_text()
          )["no_vehicle_positions"]

          committed_path = pathlib.Path("realtime_overrides.json")
          if not committed_path.exists():
              print("::notice::No committed realtime_overrides.json on this ref; "
                    f"proposal names {len(proposed)} route(s): {', '.join(proposed)}")
              raise SystemExit(0)

          committed = json.loads(committed_path.read_text())["no_vehicle_positions"]
          added = [r for r in proposed if r not in committed]
          removed = [r for r in committed if r not in proposed]
          guards = os.environ["GUARDS"]

          if not added and not removed:
              print(f"::notice::Proposed deny-list matches the committed one "
                    f"({len(committed)} routes, guards {guards}).")
          else:
              changes = " ".join([f"+{r}" for r in added] + [f"-{r}" for r in removed])
              print(f"::notice::Proposed deny-list differs from committed: "
                    f"{changes} (guards {guards})")
          PY

      - name: Upload the proposal for review
        if: steps.aggregate.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rtcov-proposal-${{ steps.day.outputs.day }}
          path: |
            out/realtime_overrides.proposed.json
            out/septacoverage.json
          retention-days: 14

      - name: Decide whether to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH_RELEASE: ${{ inputs.push_release }}
          KILL_SWITCH: ${{ vars.RELEASE_COVERAGE_ENABLED }}
          BUILT: ${{ steps.aggregate.outputs.built }}
        run: |
          set -euo pipefail
          PUBLISH=true
          if [ "${BUILT}" != "true" ]; then
            PUBLISH=false
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PUSH_RELEASE}" != "true" ]; then
            PUBLISH=false
            echo "::notice::Skipping publish: workflow_dispatch with push_release=false (build-only)"
          fi
          if [ "${KILL_SWITCH}" != "true" ]; then
            PUBLISH=false
            echo "::notice::Skipping publish: repo variable RELEASE_COVERAGE_ENABLED is not 'true' (current value: '${KILL_SWITCH}'). Set it to 'true' in Settings -> Variables to enable coverage releases."
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Publish decision: ${PUBLISH}"

      - name: Generate sha256 sidecar
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd ./out
          sha256sum septacoverage.json > septacoverage.json.sha256
          echo "sha256(septacoverage.json) = $(awk '{print $1}' septacoverage.json.sha256)"

      - name: Publish septacoverage.json to the 'current' release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `current` already exists — the meta workflow creates it — but a
          # coverage run could land first on a fresh repository.
          if ! gh release view current --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create current \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Current SEPTA meta (rolling)" \
              --notes "Rolling release: assets are overwritten by every successful build."
          fi
          gh release upload current --clobber \
            --repo "${GITHUB_REPOSITORY}" \
            ./out/septacoverage.json \
            ./out/septacoverage.json.sha256

      - name: Publish the rolling state to the 'coverage-state' release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view coverage-state --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create coverage-state \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Coverage pipeline state (internal)" \
              --notes "Internal pipeline state for the real-time coverage sampler, NOT a consumer API. Shape and retention may change without notice; do not build against it. The consumer document is septacoverage.json on the 'current' release."
          fi
          gh release upload coverage-state --clobber \
            --repo "${GITHUB_REPOSITORY}" \
            ./out/septacoverage_state.json \
            "./out/septacoverage_${DAY}.json"

      - name: Prune daily summaries older than 35 days
        # 35 rather than 28: enough slack to rebuild a full window from the
        # retained dailies after a lost or corrupt state file.
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "${DAY} -35 days" +%F)"
          echo "Pruning septacoverage_<date>.json assets older than ${CUTOFF}"
          # Read into an array rather than piping through grep: under
          # `pipefail`, a grep that matches nothing would fail the step, and
          # "no old assets to prune" is the normal case for weeks.
          mapfile -t ASSETS < <(gh release view coverage-state \
            --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          for asset in "${ASSETS[@]}"; do
            [[ "${asset}" =~ ^septacoverage_([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]] || continue
            stamp="${BASH_REMATCH[1]}"
            # ISO dates compare correctly as strings.
            if [[ "${stamp}" < "${CUTOFF}" ]]; then
              echo "Deleting ${asset}"
              gh release delete-asset coverage-state "${asset}" \
                --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done
