name: Sample real-time coverage

# Measures which SEPTA routes are publishing live vehicle positions. GTFS has
# no field for that fact, so we sample rtVehiclePosition.pb on a schedule and
# let a separate daily job fold the samples into a rolling window.
#
# Behavior summary:
#   * Eight slots a day, three hours apart, at :17 past. GitHub's scheduler is
#     heavily contended on the hour and routinely runs 10-20 minutes late
#     there; for a sampler, punctuality is the product.
#   * The slots are UTC, so in EDT they land at 22:17, 01:17, 04:17, 07:17,
#     10:17, 13:17, 16:17 and 19:17 local, an hour earlier in EST. Either way
#     two of them fall inside Owl service, which is the window nothing else
#     measures.
#   * Each run uploads one small JSON artifact. Nothing is committed.
#   * Each run also snapshots SEPTA's service alerts and bus detours and folds
#     them into that UTC day's septaalerts_<date>.json on the 'service-alerts'
#     release. Day files older than 50 days are deleted.
#   * Artifacts expire after 2 days. The aggregator reads the previous UTC day,
#     so 1 day would expire them roughly half an hour before it runs.
#   * This is the only workflow in the repository that installs a third-party
#     package. Only publish-alerts holds contents: write, and it installs
#     nothing, so the job that can write runs no third-party code.

on:
  schedule:
    - cron: '17 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: read   # publish-alerts raises this for itself alone

# No concurrency group on purpose: the slots are three hours apart, and a stuck
# run must never cancel the sample that follows it.

env:
  FEED_URL: https://www3.septa.org/gtfsrt/septa-pa-us/Vehicle/rtVehiclePosition.pb
  ALERTS_URL: https://www3.septa.org/gtfsrt/septa-pa-us/Service/rtServiceAlerts.pb

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # --require-hashes is the point of pinning; without it the hashes in
        # requirements.txt are decoration.
        run: pip install --require-hashes -r requirements.txt

      - name: Verify the bindings are importable
        # The sampler's unit tests skip themselves when gtfs-realtime-bindings
        # is absent, so that the stdlib-only release workflow can run the same
        # tests directory. That skip must never be silent here.
        run: python -c "import gtfs_rt; print(gtfs_rt.gtfs_realtime_pb2.__name__)"

      - name: Run unit tests
        # After the install and before the fetch, so a bad dependency bump
        # fails loudly eight times a day rather than quietly zeroing every
        # route count — which the aggregator would read as a coverage collapse.
        run: python -m unittest discover -s tests -v

      - name: Sample the feed
        id: sample
        run: |
          set -euo pipefail
          UTC_DATE="$(python sample_realtime_coverage.py \
            --feed-url "${FEED_URL}" \
            --output ./out/sample.json)"
          echo "utc_date=${UTC_DATE}" >> "$GITHUB_OUTPUT"
          echo "Sample belongs to UTC day ${UTC_DATE}"

      - name: Upload sample
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # The date comes from the sampler's own sampled_at rather than from a
          # separate date step, so a run straddling midnight files itself
          # consistently. run_id plus run_attempt keeps the name unique across
          # reruns, which matters because the aggregator collects by prefix.
          name: rtcov-sample-${{ steps.sample.outputs.utc_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/sample.json
          retention-days: 2
          if-no-files-found: error

  alerts:
    # Independent of `sample`, so a vehicle feed outage does not cost a
    # snapshot of alerts, or the reverse.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      utc_date: ${{ steps.snapshot.outputs.utc_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Snapshot alerts and detours
        id: snapshot
        run: |
          set -euo pipefail
          UTC_DATE="$(python sample_service_alerts.py \
            --feed-url "${ALERTS_URL}" \
            --output ./out/alerts.json)"
          echo "utc_date=${UTC_DATE}" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/alerts.json
          retention-days: 2
          if-no-files-found: error

  publish-alerts:
    # Checks out first-party code and runs it on the runner's Python with
    # nothing installed: this is the one job here that can write.
    needs: alerts
    if: vars.RELEASE_ALERTS_ENABLED != 'false'   # kill switch; unset means on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # required to create the release and upload assets
    # The day file is read, merged and rewritten, so two publishes must never
    # interleave. Slots are three hours apart; this only matters when GitHub
    # delays one badly.
    concurrency:
      group: service-alerts-publish
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAY: ${{ needs.alerts.outputs.utc_date }}
      KEEP_DAYS: 50

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Download snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot

      - name: Fetch the day's file so far
        id: day
        run: |
          set -euo pipefail
          if ! printf '%s' "${DAY}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Snapshot date must be YYYY-MM-DD, got '${DAY}'"
            exit 1
          fi
          if ! gh release view service-alerts --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create service-alerts \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Service alert archive" \
              --notes "SEPTA service alerts and bus detours, one septaalerts_<YYYY-MM-DD>.json per UTC day, kept for ${KEEP_DAYS} days. Internal archive, NOT a consumer API."
          fi
          ASSET="septaalerts_${DAY}.json"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          mkdir -p prev
          # Decide from the listing, then download without a fallback: a
          # download that fails for any other reason must fail the job rather
          # than restart the day from this one snapshot.
          # Captured first: piping into grep -q under pipefail can SIGPIPE gh
          # and read as "not found".
          NAMES="$(gh release view service-alerts --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          if grep -Fxq "${ASSET}" <<< "${NAMES}"; then
            gh release download service-alerts --repo "${GITHUB_REPOSITORY}" \
              --pattern "${ASSET}" --dir prev
            echo "day_args=--day prev/${ASSET}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Starting ${ASSET}"
            echo "day_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and publish
        env:
          ASSET: ${{ steps.day.outputs.asset }}
          DAY_ARGS: ${{ steps.day.outputs.day_args }}
        run: |
          set -euo pipefail
          mkdir -p out
          # DAY_ARGS is unquoted on purpose: it is empty or two words.
          # shellcheck disable=SC2086
          python merge_service_alerts.py --snapshot snapshot/alerts.json \
            ${DAY_ARGS} --output "out/${ASSET}"
          gh release upload service-alerts --clobber \
            --repo "${GITHUB_REPOSITORY}" "out/${ASSET}"

      - name: Prune day files older than 50 days
        run: |
          set -euo pipefail
          # Keeps today and the KEEP_DAYS - 1 days before it.
          CUTOFF="$(date -u -d "${DAY} -$((KEEP_DAYS - 1)) days" +%F)"
          mapfile -t ASSETS < <(gh release view service-alerts \
            --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          for asset in "${ASSETS[@]}"; do
            [[ "${asset}" =~ ^septaalerts_([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]] || continue
            # ISO dates compare correctly as strings.
            if [[ "${BASH_REMATCH[1]}" < "${CUTOFF}" ]]; then
              echo "Deleting ${asset}"
              gh release delete-asset service-alerts "${asset}" \
                --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done
