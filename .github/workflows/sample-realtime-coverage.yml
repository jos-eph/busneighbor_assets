name: Sample real-time coverage

# Measures which SEPTA routes are publishing live vehicle positions. GTFS has
# no field for that fact, so we sample rtVehiclePosition.pb on a schedule and
# let a separate daily job fold the samples into a rolling window.
#
# Behavior summary:
#   * Eight slots a day, three hours apart, at :17 past. GitHub's scheduler is
#     heavily contended on the hour and routinely runs 10-20 minutes late
#     there; for a sampler, punctuality is the product.
#   * The slots are UTC, so in EDT they land at 22:17, 01:17, 04:17, 07:17,
#     10:17, 13:17, 16:17 and 19:17 local, an hour earlier in EST. Either way
#     two of them fall inside Owl service, which is the window nothing else
#     measures.
#   * Each run uploads one small JSON artifact. Nothing is committed.
#   * Each run also snapshots SEPTA's service alerts and bus detours and folds
#     them into that UTC day's septaalerts_<date>.json on the 'service-alerts'
#     release.
#   * The vehicle positions behind each sample are kept too, from the same
#     fetch (no second request), in septapositions_<date>.csv on the
#     'vehicle-positions' release: one row per vehicle per sample, columns
#     described in the README. Stop, trip and direction names come from the
#     static GTFS bundle, downloaded once per UTC day and cached. Day files
#     left from the earlier JSON format are moved to CSV on the next run.
#   * Both archives delete day files older than 50 days.
#   * Artifacts expire after 2 days. The aggregator reads the previous UTC day,
#     so 1 day would expire them roughly half an hour before it runs.
#   * This is the only workflow in the repository that installs a third-party
#     package. Only the publish-* jobs hold contents: write, and they install
#     nothing, so the jobs that can write run no third-party code.

on:
  schedule:
    - cron: '17 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: read   # the publish-* jobs raise this for themselves alone

# No concurrency group on purpose: the slots are three hours apart, and a stuck
# run must never cancel the sample that follows it.

env:
  FEED_URL: https://www3.septa.org/gtfsrt/septa-pa-us/Vehicle/rtVehiclePosition.pb
  ALERTS_URL: https://www3.septa.org/gtfsrt/septa-pa-us/Service/rtServiceAlerts.pb

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      utc_date: ${{ steps.sample.outputs.utc_date }}
      gtfs_cache_key: gtfs-bundle-${{ steps.today.outputs.date }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # --require-hashes is the point of pinning; without it the hashes in
        # requirements.txt are decoration.
        run: pip install --require-hashes -r requirements.txt

      - name: Verify the bindings are importable
        # The sampler's unit tests skip themselves when gtfs-realtime-bindings
        # is absent, so that the stdlib-only release workflow can run the same
        # tests directory. That skip must never be silent here.
        run: python -c "import gtfs_rt; print(gtfs_rt.gtfs_realtime_pb2.__name__)"

      - name: Run unit tests
        # After the install and before the fetch, so a bad dependency bump
        # fails loudly eight times a day rather than quietly zeroing every
        # route count — which the aggregator would read as a coverage collapse.
        run: python -m unittest discover -s tests -v

      - name: Note the UTC date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The static GTFS bundle names the stops, trips and directions in the
      # positions archive. It is about 22 MB and changes every few weeks, so
      # it is fetched once per UTC day and cached for the day's other runs.
      - name: Restore today's GTFS bundle
        id: gtfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gtfs/gtfs_public.zip
          key: gtfs-bundle-${{ steps.today.outputs.date }}

      - name: Download the GTFS bundle
        if: steps.gtfs-cache.outputs.cache-hit != 'true'
        # Names are a convenience: a failed or slow download must never cost
        # a sample. Its retries could otherwise outlast the job's timeout.
        continue-on-error: true
        timeout-minutes: 3
        run: python gtfs_static.py --download gtfs/gtfs_public.zip

      - name: Sample the feed
        id: sample
        run: |
          set -euo pipefail
          GTFS_ARGS=()
          if [ -f gtfs/gtfs_public.zip ]; then
            GTFS_ARGS=(--gtfs-bundle gtfs/gtfs_public.zip)
          else
            echo "::warning::No GTFS bundle; positions will have no names"
          fi
          UTC_DATE="$(python sample_realtime_coverage.py \
            --feed-url "${FEED_URL}" \
            --output ./out/sample.json \
            --positions-output ./out/positions.json \
            "${GTFS_ARGS[@]}")"
          echo "utc_date=${UTC_DATE}" >> "$GITHUB_OUTPUT"
          echo "Sample belongs to UTC day ${UTC_DATE}"

      - name: Upload sample
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # The date comes from the sampler's own sampled_at rather than from a
          # separate date step, so a run straddling midnight files itself
          # consistently. run_id plus run_attempt keeps the name unique across
          # reruns, which matters because the aggregator collects by prefix.
          name: rtcov-sample-${{ steps.sample.outputs.utc_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/sample.json
          retention-days: 2
          if-no-files-found: error

      - name: Upload positions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: positions-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/positions.json
          retention-days: 2
          if-no-files-found: error

  alerts:
    # Independent of `sample`, so a vehicle feed outage does not cost a
    # snapshot of alerts, or the reverse.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      utc_date: ${{ steps.snapshot.outputs.utc_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Snapshot alerts and detours
        id: snapshot
        run: |
          set -euo pipefail
          UTC_DATE="$(python sample_service_alerts.py \
            --feed-url "${ALERTS_URL}" \
            --output ./out/alerts.json)"
          echo "utc_date=${UTC_DATE}" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/alerts.json
          retention-days: 2
          if-no-files-found: error

  publish-alerts:
    # Checks out first-party code and runs it on the runner's Python with
    # nothing installed: this and publish-positions are the only jobs here
    # that can write.
    needs: alerts
    if: vars.RELEASE_ALERTS_ENABLED != 'false'   # kill switch; unset means on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # required to create the release and upload assets
    # The day file is read, merged and rewritten, so two publishes must never
    # interleave. Slots are three hours apart; this only matters when GitHub
    # delays one badly.
    concurrency:
      group: service-alerts-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Download snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot

      - name: Merge into the day's file, publish, prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAY: ${{ needs.alerts.outputs.utc_date }}
        run: |
          ./publish_day_file.sh service-alerts septaalerts \
            merge_service_alerts.py snapshot/alerts.json "${DAY}" 50 \
            "SEPTA service alerts and bus detours, one septaalerts_<YYYY-MM-DD>.json per UTC day, kept for 50 days. Internal archive, NOT a consumer API."

  publish-positions:
    # Same arrangement as publish-alerts. The positions come from the
    # vehicle feed the sample job already fetched; nothing here calls SEPTA.
    needs: sample
    if: vars.RELEASE_POSITIONS_ENABLED != 'false'   # kill switch; unset means on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # required to create the release and upload assets
    concurrency:
      group: vehicle-positions-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Download snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: positions-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot

      # The bundle the sample job cached, so days moved from JSON below get
      # the same names as new ones. Restore only: this job never saves.
      - name: Restore today's GTFS bundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gtfs/gtfs_public.zip
          key: ${{ needs.sample.outputs.gtfs_cache_key }}

      - name: Move any JSON day files to CSV
        # A no-op once none are left. A failure leaves the JSON for the next
        # run to retry and must not cost today's positions.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./migrate_legacy_positions.sh gtfs/gtfs_public.zip

      - name: Merge into the day's file, publish, prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAY: ${{ needs.sample.outputs.utc_date }}
        run: |
          ./publish_day_file.sh vehicle-positions septapositions \
            merge_vehicle_positions.py snapshot/positions.json "${DAY}" 50 \
            "SEPTA vehicle positions from each coverage sample, one septapositions_<YYYY-MM-DD>.csv per UTC day, one row per vehicle per sample, kept for 50 days. Columns are described in the repository README. Internal archive, NOT a consumer API." \
            csv
