name: Release SEPTA meta

# Weekly refresh of septameta.json — the SEPTA bus/Metro route list and feed
# window that BusNeighbor reads at runtime. Follows the two-release pattern
# already used by jos-eph/lovmaps: an immutable dated release for pinning and a
# rolling `current` release for "always latest" consumers.
#
# Stable consumer URL:
#   https://github.com/jos-eph/busneighbor_assets/releases/download/current/septameta.json
#
# Behavior summary:
#   * Scheduled Mondays at 06:00 UTC — 02:00 EDT / 01:00 EST. GitHub cron has no
#     time zone, so the local hour shifts with DST; both land on Monday morning
#     and the exact minute does not matter, since SEPTA publishes on its own
#     cadence and this job is a no-op when nothing changed.
#   * Manual run via workflow_dispatch; set push_release=false for a build-only
#     smoke test.
#   * Publishing is gated by RELEASE_SEPTA_META_ENABLED, which must equal the
#     literal string 'true'. This is the kill switch. It is a variable of the
#     septameta-release environment (Settings -> Environments), not of the
#     repository, so flip it there without editing this file.
#   * SEPTA reissues the same feed for weeks at a time, so a run whose output
#     matches the published septameta.json publishes nothing.
#   * Dated releases beyond the most recent 30 are pruned.
#   * septashapes.json (route lines, from the same bundle) goes to `current`
#     only, under the same gates, whenever it differs from the published copy
#     apart from its `generated` time. It has no dated release.
#   * A build that would stop offering a route the published document offers
#     needs approval. The app removes a route it stops seeing from the rider's
#     saved selection, permanently. Until someone approves, the build is
#     published with those routes kept (plan_septa_release.py), so nothing
#     else waits on the decision. The run then pauses in the
#     `septameta-removals` environment; approving it there publishes the build
#     exactly as it was made. The run summary describes each change.
#   * A run that finds the same removal already waiting does not ask again. A
#     run that finds a different build cancels the older request and asks anew.
#   * approve_removals, set to exactly the removed route ids, publishes
#     without the pause. rehearse_approval walks through the pause and
#     publishes nothing.
#   * Only this workflow writes to the `current` release, and only from main.
#     The job runs in the `septameta-release` environment, which is limited to
#     main and holds RELEASE_SEPTA_META_ENABLED. A copy of this workflow on an
#     older branch has no environment, sees the switch as unset, and publishes
#     nothing.
#   * `septameta-removals` must keep a required reviewer. The run checks this
#     before it asks, because an environment without one approves itself.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      push_release:
        description: 'Build and publish a release now (false = build-only smoke test)'
        type: boolean
        default: true
      approve_removals:
        description: 'Route ids the build may stop offering, comma-separated; must match the removals exactly'
        type: string
        default: ''
      rehearse_approval:
        description: 'Walk through the approval pause and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read   # the publishing jobs raise this for themselves alone

env:
  SOURCE_URL: https://www3.septa.org/developer/gtfs_public.zip
  REMOVALS_ENVIRONMENT: septameta-removals

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: septameta-release
    permissions:
      contents: write   # create releases and upload assets
      actions: write    # cancel a run waiting on an older build
    # On the publishing jobs, not the workflow: a run paused for approval
    # must not hold up the runs that follow it.
    concurrency:
      group: release-septa-meta
      cancel-in-progress: false   # never let a manual run clobber a scheduled run mid-flight
    outputs:
      ask: ${{ steps.gate.outputs.ask }}
      artifact: ${{ steps.gate.outputs.artifact }}
      rehearsal: ${{ steps.gate.outputs.rehearsal }}
      pending: ${{ steps.gate.outputs.pending }}
      published_sha256: ${{ steps.gate.outputs.published_sha256 }}
      start_date: ${{ steps.build.outputs.start_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        # Stdlib-only and offline, so this fails the job before the download.
        # The sampler's tests skip themselves here rather than failing: they
        # need gtfs-realtime-bindings, and this workflow deliberately installs
        # nothing. See sample-realtime-coverage.yml, which runs them for real.
        run: python -m unittest discover -s tests -v

      - name: Build septameta.json
        id: build
        run: |
          set -euo pipefail
          START_DATE="$(python build_septa_meta.py \
            --source-url "${SOURCE_URL}" \
            --output-dir ./out)"
          echo "start_date=${START_DATE}" >> "$GITHUB_OUTPUT"
          echo "START_DATE=${START_DATE}" >> "$GITHUB_ENV"

      - name: Build septashapes.json
        # Same bundle as septameta.json, so both describe one GTFS version.
        run: python build_septa_shapes.py --gtfs-zip ./out/gtfs_public.zip --output-dir ./out

      - name: Decide whether to publish
        id: gate
        # Five independent conditions must hold:
        #   1. The trigger is not a workflow_dispatch with push_release=false.
        #   2. RELEASE_SEPTA_META_ENABLED == 'true' (kill switch, held by the
        #      septameta-release environment). If unset, publishing is skipped.
        #   3. The run is on main.
        #   4. The build differs from the published `current` asset.
        #   5. check_septa_meta.py finds no route the app would stop offering,
        #      compared against both the live copy and the newest dated
        #      release, or the removals match approve_removals exactly.
        #      plan_septa_release.py runs first and keeps unapproved removals
        #      in the document, so what reaches this check offers them still.
        # septashapes.json needs 1-3, no block from 5, and a difference from
        # the copy on `current` (or no copy yet). Condition 4 doesn't apply:
        # a first shapes publish happens while septameta.json is unchanged.
        # Every lookup fails the job on error. Treating a failed or missing
        # download as "nothing published" would skip check 5. Only a
        # repository with no release of either kind is a first publish.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH_RELEASE: ${{ inputs.push_release }}
          INPUT_REHEARSE: ${{ inputs.rehearse_approval }}
          APPROVE_REMOVALS: ${{ inputs.approve_removals }}
          KILL_SWITCH: ${{ vars.RELEASE_SEPTA_META_ENABLED }}
        run: |
          set -euo pipefail
          PUBLISH=true
          BLOCKED=false
          REHEARSAL=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_REHEARSE}" = "true" ]; then
            REHEARSAL=true
            PUBLISH=false
            echo "::notice::Rehearsal: pausing for approval, publishing nothing."
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PUSH_RELEASE}" != "true" ]; then
            PUBLISH=false
            echo "::notice::Skipping publish: workflow_dispatch with push_release=false (build-only)"
          fi
          if [ "${KILL_SWITCH}" != "true" ]; then
            PUBLISH=false
            echo "::notice::Skipping publish: RELEASE_SEPTA_META_ENABLED is not 'true' (current value: '${KILL_SWITCH}'). It lives on the septameta-release environment."
          fi
          if [ "${PUBLISH}" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            PUBLISH=false
            BLOCKED=true
            echo "::error::Refusing to publish from ${GITHUB_REF}; septameta.json is published from main only. Use push_release=false for a build-only run."
          fi
          ELIGIBLE="${PUBLISH}"
          PLAN_ARGS=()
          HAVE_CURRENT=false
          PREVIOUS_NAMES=/nonexistent/route_names.json
          if [ "${PUBLISH}" = "true" ]; then
            TAGS="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 \
              --json tagName --jq '.[].tagName')"
            BASELINES=()
            mkdir -p /tmp/published

            if grep -Fxq current <<< "${TAGS}"; then
              ASSETS="$(gh release view current --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name')"
              if grep -Fxq septameta.json <<< "${ASSETS}"; then
                gh release download current --repo "${GITHUB_REPOSITORY}" \
                  --pattern septameta.json --dir /tmp/published --clobber
                BASELINES+=(--published /tmp/published/septameta.json)
                HAVE_CURRENT=true
              else
                echo "::warning::'current' has no septameta.json; checking against the newest dated release instead."
              fi
            fi

            # Tags are septameta-YYYYMMDD, so the lexical maximum is the newest.
            NEWEST="$(grep -E '^septameta-[0-9]{8}$' <<< "${TAGS}" | sort | tail -n 1 || true)"
            if [ -n "${NEWEST}" ]; then
              DATED_ASSET="septameta_${NEWEST#septameta-}.json"
              DATED_ASSETS="$(gh release view "${NEWEST}" --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name')"
              if grep -Fxq "${DATED_ASSET}" <<< "${DATED_ASSETS}"; then
                gh release download "${NEWEST}" --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${DATED_ASSET}" --dir /tmp/published --clobber
                BASELINES+=(--published "/tmp/published/${DATED_ASSET}")
              else
                echo "::warning::${NEWEST} has no ${DATED_ASSET}."
              fi
              # Names from the last release, so the report can still name a
              # route that has left the feed.
              NAMES_ASSET="route_names_${NEWEST#septameta-}.json"
              if grep -Fxq "${NAMES_ASSET}" <<< "${DATED_ASSETS}"; then
                gh release download "${NEWEST}" --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${NAMES_ASSET}" --dir /tmp/published --clobber
                PREVIOUS_NAMES="/tmp/published/${NAMES_ASSET}"
              fi
            fi
            PLAN_ARGS=("${BASELINES[@]}")

            if [ "${#BASELINES[@]}" -eq 0 ]; then
              if grep -Fxq current <<< "${TAGS}" || [ -n "${NEWEST}" ]; then
                # Releases exist but none of them holds a document. That is
                # damage, not a fresh repository; never publish blind into it.
                BASELINES=(--published /nonexistent/septameta.json)
              else
                echo "::notice::No septameta release of any kind yet; first publish."
                BASELINES=(--first-publish)
              fi
            fi
          fi

          # Sets the candidate aside in ./out/pure. If it drops routes nobody
          # has approved, ./out is rewritten with those routes kept.
          PLAN="$(python plan_septa_release.py --output-dir ./out --pure-dir ./out/pure \
            "${PLAN_ARGS[@]}" --approve-removals "${APPROVE_REMOVALS}")"
          PENDING="$(sed -n 's/^pending=//p' <<< "${PLAN}")"
          CANDIDATE_SHA="$(sed -n 's/^candidate_sha256=//p' <<< "${PLAN}")"

          # The report informs and decides nothing, so nothing here may fail
          # the run.
          mkdir -p /tmp/coverage
          gh release download coverage --repo "${GITHUB_REPOSITORY}" \
            --pattern septacoverage.json --dir /tmp/coverage --clobber \
            || echo "::warning::No coverage document; the report will say unknown."
          if python report_route_changes.py \
               --candidate ./out/pure/septameta.json --to-publish ./out/septameta.json \
               "${PLAN_ARGS[@]}" --gtfs-zip ./out/gtfs_public.zip \
               --previous-names "${PREVIOUS_NAMES}" \
               --coverage /tmp/coverage/septacoverage.json --pending "${PENDING}" \
               --names-output "./out/route_names_${START_DATE}.json" \
               --report-output ./out/route_changes.md; then
            cat ./out/route_changes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not write the route change report."
          fi

          if [ "${PUBLISH}" = "true" ] && [ "${HAVE_CURRENT}" = "true" ] \
               && cmp -s /tmp/published/septameta.json ./out/septameta.json; then
            PUBLISH=false
            echo "::notice::Skipping publish: build is identical to the published septameta.json (SEPTA feed ${START_DATE} unchanged)."
          fi
          if [ "${PUBLISH}" = "true" ]; then
            if ! python check_septa_meta.py --candidate ./out/septameta.json \
                   "${BASELINES[@]}" --approve-removals "${APPROVE_REMOVALS}"; then
              PUBLISH=false
              BLOCKED=true
            fi
          fi

          # Ask for approval once per build. A run already waiting on this
          # exact candidate stands; one waiting on another build is replaced.
          ASK=false
          UNGUARDED=false
          ARTIFACT="septameta-removal-${CANDIDATE_SHA}"
          if [ "${REHEARSAL}" = "true" ]; then
            ASK=true
            ARTIFACT="septameta-rehearsal-${GITHUB_RUN_ID}"
          elif [ -n "${PENDING}" ] && [ "${ELIGIBLE}" = "true" ] && [ "${BLOCKED}" = "false" ]; then
            ASK=true
            WAITING="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow release-septa-meta.yml --status waiting --limit 50 \
              --json databaseId --jq '.[].databaseId')"
            while IFS= read -r RUN; do
              if [ -z "${RUN}" ] || [ "${RUN}" = "${GITHUB_RUN_ID}" ]; then
                continue
              fi
              HELD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts" \
                --jq '.artifacts[].name')"
              if grep -Fxq "${ARTIFACT}" <<< "${HELD}"; then
                ASK=false
                echo "::notice::Removing ${PENDING} is already waiting for approval: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN}"
              elif grep -q '^septameta-removal-' <<< "${HELD}"; then
                echo "::notice::Canceling run ${RUN}: it is waiting on an older build."
                gh run cancel "${RUN}" --repo "${GITHUB_REPOSITORY}"
              fi
            done <<< "${WAITING}"
          fi
          if [ "${ASK}" = "true" ]; then
            RULES="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${REMOVALS_ENVIRONMENT}" \
              --jq '.protection_rules[].type')"
            if ! grep -Fxq required_reviewers <<< "${RULES}"; then
              # The routes are still kept, so the rest of the build goes out.
              ASK=false
              UNGUARDED=true
              echo "::error::Environment ${REMOVALS_ENVIRONMENT} has no required reviewer, so it cannot hold a removal for approval."
            fi
          fi

          PUBLISH_SHAPES=false
          if [ "${ELIGIBLE}" = "true" ] && [ "${BLOCKED}" = "false" ]; then
            PUBLISH_SHAPES=true
            CURRENT_ASSETS=""
            if grep -Fxq current <<< "${TAGS}"; then
              CURRENT_ASSETS="$(gh release view current --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name')"
            fi
            if grep -Fxq septashapes.json <<< "${CURRENT_ASSETS}"; then
              mkdir -p /tmp/published-shapes
              gh release download current --repo "${GITHUB_REPOSITORY}" \
                --pattern septashapes.json --dir /tmp/published-shapes --clobber
              if python build_septa_shapes.py --compare \
                   /tmp/published-shapes/septashapes.json ./out/septashapes.json; then
                PUBLISH_SHAPES=false
                echo "::notice::Skipping septashapes.json: identical to the published copy apart from its generated time."
              fi
            fi
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "publish_shapes=${PUBLISH_SHAPES}" >> "$GITHUB_OUTPUT"
          if [ "${UNGUARDED}" = "true" ]; then
            BLOCKED=true
          fi
          echo "blocked=${BLOCKED}" >> "$GITHUB_OUTPUT"
          echo "ask=${ASK}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "rehearsal=${REHEARSAL}" >> "$GITHUB_OUTPUT"
          echo "pending=${PENDING}" >> "$GITHUB_OUTPUT"
          echo "published_sha256=$(sha256sum ./out/septameta.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "Publish decision: ${PUBLISH}; septashapes.json: ${PUBLISH_SHAPES}"

      - name: Generate sha256 sidecars
        # `sha256sum` output format — consumers verify with `sha256sum -c`.
        run: |
          set -euo pipefail
          cd ./out
          for f in septameta.json "septameta_${START_DATE}.json" septashapes.json; do
            sha256sum "${f}" > "${f}.sha256"
            echo "sha256(${f}) = $(awk '{print $1}' "${f}.sha256")"
          done

      - name: Build traceability blob
        run: |
          set -euo pipefail
          {
            echo "start_date: ${START_DATE}"
            echo "generated_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_sha: ${GITHUB_SHA}"
            echo "git_ref: ${GITHUB_REF}"
            echo "workflow_run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "source_url: ${SOURCE_URL}"
            echo "septameta_sha256: $(awk '{print $1}' ./out/septameta.json.sha256)"
            echo "septashapes_sha256: $(awk '{print $1}' ./out/septashapes.json.sha256)"
          } > "./out/septameta_${START_DATE}.run.txt"
          cat "./out/septameta_${START_DATE}.run.txt"

      - name: Upload build artifact
        # Keeps a build-only smoke test inspectable without cutting a release.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: septameta-${{ steps.build.outputs.start_date }}
          path: |
            ./out/septameta*.json
            ./out/septashapes.json
          retention-days: 14

      - name: Set the candidate aside for approval
        # Kept longer than a review can stay open, which is 30 days.
        if: steps.gate.outputs.ask == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.gate.outputs.artifact }}
          path: ./out/pure/
          if-no-files-found: error
          retention-days: 35

      - name: Create or update the dated release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="septameta-${START_DATE}"
          ASSETS=(
            "./out/septameta_${START_DATE}.json"
            "./out/septameta_${START_DATE}.json.sha256"
            "./out/septameta_${START_DATE}.run.txt"
          )
          if [ -f "./out/route_names_${START_DATE}.json" ]; then
            ASSETS+=("./out/route_names_${START_DATE}.json")
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # SEPTA revised the feed inside an effective window it had already
            # opened, so the dated file has to be corrected in place: the
            # filename is keyed on feed_start_date and that has not moved. The
            # run.txt asset records which build the assets came from.
            echo "::notice::${TAG} already exists; SEPTA revised feed ${START_DATE} in place. Updating its assets."
            gh release upload "${TAG}" --clobber \
              --repo "${GITHUB_REPOSITORY}" "${ASSETS[@]}"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SEPTA meta ${START_DATE}" \
              --notes "SEPTA route list and feed window for the service period starting ${START_DATE}. Built from ${SOURCE_URL} by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
              "${ASSETS[@]}"
          fi

      - name: Update the 'current' rolling release
        if: steps.gate.outputs.publish == 'true' || steps.gate.outputs.publish_shapes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ steps.gate.outputs.publish }}
          PUBLISH_SHAPES: ${{ steps.gate.outputs.publish_shapes }}
        run: |
          set -euo pipefail
          if ! gh release view current --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create current \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Current SEPTA meta (rolling)" \
              --notes "Rolling release: septameta.json is overwritten by every successful weekly build. Pin to a dated septameta-<start_date> release for immutability."
          fi
          ASSETS=()
          if [ "${PUBLISH}" = "true" ]; then
            ASSETS+=(./out/septameta.json ./out/septameta.json.sha256)
          fi
          if [ "${PUBLISH_SHAPES}" = "true" ]; then
            ASSETS+=(./out/septashapes.json ./out/septashapes.json.sha256)
          fi
          gh release upload current --clobber \
            --repo "${GITHUB_REPOSITORY}" "${ASSETS[@]}"

      - name: Prune dated releases beyond the most recent 30
        # Keep the 30 most recent dated releases; never prune `current`. Sort by
        # tagName (septameta-YYYYMMDD sorts lexicographically == chronologically),
        # not createdAt: GitHub takes a release's created_at from its target
        # commit, and every dated release here tags the same unchanged main
        # commit, so createdAt ties and the sort would prune arbitrarily.
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 \
            --json tagName \
            --jq 'map(select(.tagName | startswith("septameta-"))) | sort_by(.tagName) | reverse | .[30:] | .[].tagName' \
            > /tmp/prune.txt
          if [ ! -s /tmp/prune.txt ]; then
            echo "Nothing to prune (have <= 30 dated releases)."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "Pruning old release: ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}"
          done < /tmp/prune.txt

      - name: Fail the run if publishing was blocked
        # Last, so the build artifact above is still uploaded for inspection.
        if: steps.gate.outputs.blocked == 'true'
        run: |
          echo "::error::Publishing was blocked. See 'Decide whether to publish' for why."
          exit 1

  await-approval:
    # Does nothing itself. The environment's required reviewer is the pause.
    needs: release
    if: needs.release.outputs.ask == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: septameta-removals
    permissions: {}
    steps:
      - name: Record the approval
        env:
          PENDING: ${{ needs.release.outputs.pending }}
        run: |
          echo "Approved to stop offering ${PENDING:-nothing (rehearsal)}."

  publish-removal:
    # Publishes the candidate the release job set aside, never a rebuild, so
    # what was approved is what goes out.
    needs: [release, await-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: septameta-release
    permissions:
      contents: write
    concurrency:
      group: release-septa-meta
      cancel-in-progress: false
    env:
      START_DATE: ${{ needs.release.outputs.start_date }}
      PENDING: ${{ needs.release.outputs.pending }}

    steps:
      - name: Fetch the approved candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.release.outputs.artifact }}
          path: ./approved

      - name: Publish the approved candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL: ${{ needs.release.outputs.rehearsal }}
          EXPECTED_SHA256: ${{ needs.release.outputs.published_sha256 }}
          KILL_SWITCH: ${{ vars.RELEASE_SEPTA_META_ENABLED }}
        run: |
          set -euo pipefail
          cd ./approved
          DATED="septameta_${START_DATE}.json"
          for f in septameta.json "${DATED}"; do
            sha256sum "${f}" > "${f}.sha256"
            echo "sha256(${f}) = $(awk '{print $1}' "${f}.sha256")"
          done
          if [ "${REHEARSAL}" = "true" ]; then
            echo "::notice::Rehearsal: the approval step works. Nothing was published."
            exit 0
          fi
          if [ "${KILL_SWITCH}" != "true" ]; then
            echo "::error::RELEASE_SEPTA_META_ENABLED is not 'true'; not publishing."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Refusing to publish from ${GITHUB_REF}."
            exit 1
          fi

          # Days may have passed. If a later run has published since, this
          # candidate is stale and the approval belongs to that run instead.
          mkdir -p /tmp/live
          gh release download current --repo "${GITHUB_REPOSITORY}" \
            --pattern septameta.json --dir /tmp/live --clobber
          LIVE_SHA256="$(sha256sum /tmp/live/septameta.json | awk '{print $1}')"
          if [ "${LIVE_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::The published septameta.json has changed since this run asked, so this approval no longer applies. Approve the newer run instead."
            exit 1
          fi

          {
            echo "start_date: ${START_DATE}"
            echo "generated_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_sha: ${GITHUB_SHA}"
            echo "git_ref: ${GITHUB_REF}"
            echo "workflow_run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "source_url: ${SOURCE_URL}"
            echo "septameta_sha256: $(awk '{print $1}' septameta.json.sha256)"
            echo "removals_approved: ${PENDING}"
          } > "septameta_${START_DATE}.run.txt"
          cat "septameta_${START_DATE}.run.txt"

          TAG="septameta-${START_DATE}"
          DATED_ASSETS=("${DATED}" "${DATED}.sha256" "septameta_${START_DATE}.run.txt")
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber \
              --repo "${GITHUB_REPOSITORY}" "${DATED_ASSETS[@]}"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SEPTA meta ${START_DATE}" \
              --notes "SEPTA route list and feed window for the service period starting ${START_DATE}. Built from ${SOURCE_URL} by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
              "${DATED_ASSETS[@]}"
          fi
          gh release upload current --clobber \
            --repo "${GITHUB_REPOSITORY}" septameta.json septameta.json.sha256
          echo "::notice::Published without ${PENDING}."
