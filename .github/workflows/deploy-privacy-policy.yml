name: Deploy Privacy Policy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'PRIVACY_POLICY.md'
      - 'SUPPORT.md'
      - 'index.html'
      - 'robots.txt'
      - 'BingSiteAuth.xml'
      - 'sitemap.xml'
      - 'images/**'
      - 'template.html'
      - 'style.css'
      - 'share.html'
      - 'go.html'
      - 'routelink.js'
      - 'routeqr.js'
      - 'vendor/**'
      - 'routelink.css'
      - 'routepage.css'
      - 'route_page.html'
      - 'routes_page.html'
      - 'build_route_pages.py'
      - 'route_facts.py'
      - 'route_places.json'
      - 'build_site.py'
      - 'partials/**'
      - '.well-known/**'
      - '.github/workflows/deploy-privacy-policy.yml'
  # The route pages read septameta.json from the site, so redeploy whenever a
  # release finishes. The daily run covers a release paused for approval.
  workflow_run:
    workflows: ["Release SEPTA meta"]
    types: [completed]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build Accessible HTML
        run: |
          mkdir -p _site
          pandoc PRIVACY_POLICY.md \
            --from=markdown \
            --to=html5 \
            --template=template.html \
            --metadata pagetitle="Privacy Policy" \
            --metadata canonical="https://bus.dydx.org/bn_privacy.html" \
            --variable description="BusNeighbor's privacy policy in plain English: no accounts, ads, analytics, crash reporting, or tracking, and your location never leaves your phone." \
            --output=_site/bn_privacy.html
          pandoc SUPPORT.md \
            --from=markdown \
            --to=html5 \
            --template=template.html \
            --metadata pagetitle="Support" \
            --metadata canonical="https://bus.dydx.org/support.html" \
            --variable description="Get help with BusNeighbor, the free live SEPTA bus and trolley tracker for Philadelphia. Email bus@dydx.org with questions or problems." \
            --output=_site/support.html
          cp style.css robots.txt sitemap.xml _site/
          # Bing Webmaster Tools site verification.
          cp BingSiteAuth.xml _site/
          cp routelink.js routeqr.js routelink.css routepage.css _site/
          # The QR encoder routeqr.js imports.
          cp -r vendor _site/
          # index, share, and go, with the shared pieces in partials/ filled in.
          python3 build_site.py --output-dir _site
          cp -r images _site/
          # Lets the iOS and Android apps open bus.dydx.org/go links.
          cp -r .well-known _site/
          for f in apple-app-site-association assetlinks.json; do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "_site/.well-known/$f"
          done

      # Browsers can't fetch the release asset (no CORS header), so the site
      # serves its own copy. A failed download fails the build and leaves the
      # previous deploy live.
      - name: Copy the route list
        run: |
          curl -fsSL --retry 3 -o _site/septameta.json \
            https://github.com/jos-eph/busneighbor_assets/releases/download/current/septameta.json
          python3 -c "import json; assert json.load(open('_site/septameta.json'))['buses']['route_list']"

      # One page per route at /route/<id>, the index at /routes.html, and the
      # sitemap (replacing the copy of the fixed entries above).
      - name: Build the route pages
        run: |
          mkdir -p /tmp/route-data
          for f in septashapes.json route_names.json route_stops.json; do
            curl -fsSL --retry 3 -o "/tmp/route-data/${f}" \
              "https://github.com/jos-eph/busneighbor_assets/releases/download/current/${f}"
          done
          python3 build_route_pages.py --meta _site/septameta.json \
            --shapes /tmp/route-data/septashapes.json --names /tmp/route-data/route_names.json \
            --stops /tmp/route-data/route_stops.json \
            --output-dir _site/route --index _site/routes.html --sitemap _site/sitemap.xml

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
