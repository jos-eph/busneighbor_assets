<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <!-- Every route link shares this page, so it stays out of search results. -->
  <meta name="robots" content="noindex">
  <title>BusNeighbor — Open routes</title>
  <link rel="icon" href="/images/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/routelink.css">
</head>
<body class="landing tool-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="tool-header">
    <div class="wrap">
      <!-- #include brand.html -->
    </div>
  </header>

  <main id="main-content">
    <div class="wrap">
      <h1>Open routes in BusNeighbor</h1>
      <p id="go-summary">This link shows routes in BusNeighbor.</p>

      <h2>Have the app?</h2>
      <p><a id="go-open" class="button" href="busneighbor://go">Open in BusNeighbor</a></p>
      <p id="go-hint" class="hint">BusNeighbor asks before it replaces the routes you already have.</p>

      <h2>Need the app?</h2>
      <p>BusNeighbor is free. Install it, then come back and open this link again.</p>
      <div class="store-slot">
        <!-- #include store-badges.html -->
      </div>
    </div>
  </main>

  <!-- #include footer.html -->
  <script type="module">
    import { initGoPage } from '/routelink.js';
    initGoPage();
  </script>
